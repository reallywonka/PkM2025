<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Judulnya kita ubah sedikit -->
    <title>Materi HTML - Website Pembelajaran</title>
    <link rel="stylesheet" href="assets/css/style.css" />
    <link rel="icon" href="https://www.w3school.com/favicon.ico/" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      xintegrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@100;300;400;500;700;900&display=swap"
      rel="stylesheet"
    />

    <!-- Style dari home.js (tetap ada, tidak masalah) -->
    <style>
      /* Style untuk Beranda yang lebih interaktif */
      .homepage-container {
        text-align: center;
        padding: 20px 40px; /* Padding lebih banyak */
        color: var(--bs-black);
      }

      .hero-section {
        background: linear-gradient(135deg, var(--sidebar-bg), var(--bs-white));
        border-radius: 12px;
        padding: 40px;
        margin-bottom: 30px;
        border: 1px solid var(--border-color);
      }

      .homepage-logo {
        width: 120px; /* Sedikit lebih kecil agar proporsional */
        height: auto;
        margin-bottom: 15px;
      }

      .hero-section h1 {
        font-size: 2.5em;
        font-weight: 700;
        margin: 10px 0;
      }

      .hero-section p.subtitle {
        font-size: 1.2em;
        color: var(--bs-black);
        opacity: 0.8;
        max-width: 600px;
        margin: 15px auto 30px;
      }

      /* Tombol CTA Interaktif */
      .cta-button {
        background-color: var(--bs-black);
        color: var(--bs-white);
        padding: 15px 30px;
        font-size: 1.1em;
        font-weight: 700;
        border: none;
        border-radius: 30px;
        cursor: pointer;
        transition: transform 0.2s ease, background-color 0.2s;
      }

      /* Penyesuaian Dark Mode untuk Tombol CTA */
      body.dark-mode .cta-button {
        background-color: var(--bs-yellow);
        color: #282a35; /* Paksa hitam pekat untuk kontras */
      }

      .cta-button:hover {
        transform: scale(1.05);
      }

      /* Kisi Teknologi */
      .tech-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 20px;
        margin-top: 40px;
        text-align: left;
      }

      .tech-item {
        background-color: var(--bs-white);
        padding: 20px;
        border-radius: 8px;
        border: 1px solid var(--border-color);
        transition: box-shadow 0.2s ease;
      }

      .tech-item:hover {
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        cursor: pointer;
        transform: translateY(-3px);
      }

      body.dark-mode .tech-item:hover {
        box-shadow: 0 4px 15px rgba(255, 255, 255, 0.05);
        transform: translateY(-3px);
      }

      .tech-item i {
        font-size: 2em;
        color: var(--bs-yellow); /* Warna kuning sebagai aksen */
      }

      /* Penyesuaian Dark Mode untuk Ikon */
      body.dark-mode .tech-item i {
        color: var(--bs-black); /* Jadi teks terang di dark mode */
      }

      .tech-item h3 {
        font-size: 1.2em;
        margin-top: 10px;
        color: var(--bs-black);
      }

      .homepage-container hr {
        border: none;
        height: 1px;
        background-color: var(--border-color); /* Garis pemisah */
        margin: 40px 0;
      }

      .features {
        display: flex;
        justify-content: space-around;
        margin-top: 40px;
        text-align: left;
        flex-wrap: wrap; /* Agar responsif di layar kecil */
        gap: 20px;
      }
      .feature-item {
        width: 30%;
        min-width: 250px; /* Agar tidak terlalu kecil */
      }
      .feature-item h3 {
        border-bottom: 2px solid var(--border-color);
        padding-bottom: 5px;
      }
    </style>
  </head>
  <body>
    <!-- Header tetap sama persis -->
    <header>
      <div class="header-left">
        <!-- [DIUBAH] Tombol logo sekarang kembali ke Index.html -->
        <a href="Index.html" class="menu-btn" id="logo-btn">
          <div class="logo">
            <img src="assets/image/logo.png" alt="Logo" />
          </div>
        </a>
        <div href="#Tutorials" class="menu-btn" id="tutorial-btn">
          Tutorials
          <i class="fa-solid fa-caret-down"></i>
        </div>
        <div href="#References" class="menu-btn" id="references-btn">
          References
          <i class="fa-solid fa-caret-down"></i>
        </div>
        <div href="#Excersices" class="menu-btn" id="excersices-btn">
          Excersices
          <i class="fa-solid fa-caret-down" class="menu-btn"></i>
        </div>
        <div href="#videos" class="menu-btn" id="video-btn">Videos</div>
      </div>
      <div class="header-right">
        <div class="DarkMode" id="light-dark-toggle">
          <i class="fa-solid fa-circle-half-stroke"></i>
        </div>
    </header>

    <!-- Navigasi Pop-up (Tutorials) tetap sama -->
    <div
      class="nested-navigation nested_navigation_hidden"
      id="nested-navigation_id"
    >
      <div class="nested-navigation-close-btn" id="nested-navigation-close-Btn">
        <button><i class="fa-solid fa-xmark" class="menu-btn"></i></button>
      </div>
      <div class="nested-navigation-content">
        <h1>Tutorials</h1>
        <div class="nasted-navigation-content-data" id="tutorials-nav-content">
          <!-- Konten ini akan di-generate oleh JS -->
        </div>
      </div>
    </div>

    <!-- Navigasi Pop-up (References) tetap sama -->
    <div
      class="nested-navigation nested_navigation_hidden"
      id="nested-navigation_references"
    >
      <div
        class="nested-navigation-close-btn"
        id="nested-navigation-close-Btn-refs"
      >
        <button><i class="fa-solid fa-xmark" class="menu-btn"></i></button>
      </div>
      <div class="nested-navigation-content">
        <h1>References</h1>
        <div class="nasted-navigation-content-data" id="references-nav-content">
          <!-- Konten ini akan di-generate oleh JS -->
        </div>
      </div>
    </div>

    <!-- Navigasi Pop-up (Excersices) tetap sama -->
    <div
      class="nested-navigation nested_navigation_hidden"
      id="nested-navigation_excersices"
    >
      <div
        class="nested-navigation-close-btn"
        id="nested-navigation-close-Btn-excs"
      >
        <button><i class="fa-solid fa-xmark" class="menu-btn"></i></button>
      </div>
      <div class="nested-navigation-content">
        <h1>Excersices</h1>
        <div class="nasted-navigation-content-data" id="excersices-nav-content">
          <!-- Konten ini akan di-generate oleh JS -->
        </div>
      </div>
    </div>

    <!-- Layout Utama untuk Konten -->
    <div class="main-container">
      <!-- Sidebar tetap sama -->
      <nav class="sidebar" id="sidebar">
        <h2 id="sidebar-title">Pilih Materi</h2>
        <ul id="sidebar-menu">
          <!-- Link materi (HTML 1, HTML 2, dst) akan di-generate JS di sini -->
        </ul>
      </nav>

      <!-- Area Konten Utama -->
      <!-- [DIUBAH] Konten beranda DIHAPUS. Sekarang kosong. -->
      <main class="content-area" id="content-area">
        <!-- Konten materi HTML akan dimuat di sini oleh JS -->
      </main>
    </div>

    <!-- [DIUBAH] Kita memuat SCRIPT BARU, khusus untuk halaman ini -->
    <script src="assets/js/HTML_page_script.js" type="module"></script>
    
  </body>
</html>
